    <rect x="82" y="37" width="16" height="4" rx="2"/><rect x="82" y="62" width="16" height="4" rx="2"/><rect x="82" y="87" width="16" height="4" rx="2"/>
  </g>
  <!-- mod: a puzzle piece -->
