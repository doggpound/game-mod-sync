# Defaults for any game without its own plugins/games/<game id>.conf.
# <game id> is the folder name Gale uses (e.g. valheim, lethal-company).
# Every file here is shell syntax. A game file only needs the lines it changes.

# Shown in menus. Default: the id in title case (lethal-company -> Lethal Company).
GAME_NAME=$(printf '%s' "$GAME_ID" | awk -F- '{ for (i = 1; i <= NF; i++) $i = toupper(substr($i, 1, 1)) substr($i, 2) } 1')

# Where mods and configs live comes from the mod loader (plugins/loaders/,
# detected from the profile). Set any of these here to override it:
#   SYNC_DIRS    mod folders, relative to the profile and the server's game folder,
#                mirrored with --delete (only list folders the mod manager fully owns)
#   EXCLUDES     paths inside SYNC_DIRS never sent or deleted (rsync patterns)
#   CONFIG_DIRS  config folders: offered per file, never deleted
#   CONFIG_SKIP  config paths never offered (rsync patterns)

# Folder that identifies the game on the server, used to find instances.
# Defaults to the first SYNC_DIRS entry.
GAME_MARKER=""

# Case-insensitive regex. Server folders that match are listed first when
# picking where a profile goes (useful when several games use BepInEx).
# Default: the id with dashes optional (lethal-company matches LethalCompany01).
SERVER_MATCH=$(printf '%s' "$GAME_ID" | sed 's/-/[-_ ]?/g')

# Files a server type installs itself when one of its settings is on, as
# MANAGED_<backend>="setting=pattern[,pattern] ...". When the setting is on,
# you're asked once (default: yes) to leave those files alone.
# Example: MANAGED_amp="valheim_plus_install=ValheimPlus.dll"

# Thunderstore community and the categories that mark a mod as client-side or
# server-side (extended regexes). A config is not offered when its mod is
# client-side only.
THUNDERSTORE_COMMUNITY="$GAME_ID"
TAG_CLIENT="^(Client-side|Clientside|Client-only|Client Side)$"
TAG_SERVER="^(Server-side|Serverside|Server-only|Server Side)$"

# Shown after a successful sync.
AFTER_SYNC="Restart the server so it loads the new mods."

# World download (D in the main menu, --download-world): copies a world from
# the server into this computer's saves, to try mod updates on a copy of it.
# Off unless WORLD_FORMAT is set.
#   WORLD_FORMAT       how the game saves a world: a plugin in plugins/worlds/
#                      (valheim, or files: <world>.<ext> for each WORLD_FILES)
#   WORLD_FILES        for WORLD_FORMAT=files: the extensions, the first one being
#                      a file every world has (e.g. "fwl db")
#   SERVER_SAVES       the game's save folder on the server, relative to the SSH
#                      user's home, when the server type can't tell
#   SERVER_WORLDS      the worlds folder inside the save folder
#   SAVES_<backend>    how a server type finds the save folder and world; AMP:
#                      "ARG SETTING" (command-line option, AppSettings entry)
#   LOCAL_WORLDS_WIN   the worlds folder under the Windows user folder (WSL, Git Bash)
#   LOCAL_WORLDS_HOME  the worlds folder under $HOME (Linux, macOS)
#   WORLD_NOTE         shown before a world is downloaded
WORLD_FORMAT=""
