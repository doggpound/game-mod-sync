# Valheim (BepInExPack_Valheim). Steam dedicated server app id 896660.
GAME_NAME="Valheim"
# MMHOOK/                        generated on the server by HookGenPatcher at startup
# Valheim.DisplayBepInExInfo.dll ships with the server's BepInEx pack, not with Gale profiles
EXCLUDES="MMHOOK/ Valheim.DisplayBepInExInfo.dll"
SERVER_MATCH="valheim|896660"
# Add-ons the AMP Valheim template installs itself when its option is on
# ("Install ValheimPlus" = setting valheim_plus_install). Offered as "leave alone".
MANAGED_amp="valheim_plus_install=ValheimPlus.dll"
# World download: worlds are folders of chunks (plugins/worlds/valheim.sh).
# AMP starts the server with -savedir "Saves" -world "{{WorldName}}"; the
# dedicated server's own default is ~/.config/unity3d/IronGate/Valheim.
WORLD_FORMAT="valheim"
SERVER_SAVES=".config/unity3d/IronGate/Valheim"
SERVER_WORLDS="worlds_local"
SAVES_amp="-savedir WorldName"
LOCAL_WORLDS_WIN="AppData/LocalLow/IronGate/Valheim/worlds_local"
LOCAL_WORLDS_HOME=".config/unity3d/IronGate/Valheim/worlds_local"
WORLD_NOTE="Your character (inventory, skills) is saved on this computer: what it gains or loses in the copy comes along to the server. Test with a spare character."
