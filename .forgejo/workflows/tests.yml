name: tests

# Runs tests/run.sh: one test file per plugin (tests/plugins/<kind>/<name>.sh)
# plus an end-to-end sync, and checks that the README's badges (docs/badges/)
# match the results. main is protected: changes come in through pull requests,
# and this check must pass before one can be merged. So it runs on pull
# requests only, not again on the merge (run it by hand for main if needed).
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          need=""
          for t in rsync perl shellcheck tmux whiptail python3; do command -v "$t" >/dev/null || need="$need $t"; done
          if [ -n "$need" ]; then
            if command -v sudo >/dev/null && [ "$(id -u)" != 0 ]; then S=sudo; else S=""; fi
            $S apt-get update -qq && $S apt-get install -y -qq $need >/dev/null
          fi
          bash --version | sed -n 1p; rsync --version | sed -n 1p; perl -v | sed -n 2p

      - name: Lint
        run: shellcheck -x -S warning game-mod-sync lib/*.sh plugins/*/*.sh .forgejo/release.sh .forgejo/go-setup.sh tests/*.sh tests/plugins/*/*.sh tests/core/*.sh docs/screenshots/make.sh

      - name: Test every plugin
        run: |
          if bash tests/run.sh --badges "$RUNNER_TEMP/badges"; then :; else touch "$RUNNER_TEMP/failed"; fi

      - name: Badges up to date
        run: |
          # The README's badges are files in docs/badges/, so they show on Forgejo
          # and on the GitHub mirror. They must match what the tests produce.
          if ! diff -r docs/badges "$RUNNER_TEMP/badges" >/dev/null 2>&1; then
            echo "docs/badges/ is out of date - run: tests/run.sh --badges docs/badges, and commit it"
            diff -r docs/badges "$RUNNER_TEMP/badges" | head -n 20 || true
            touch "$RUNNER_TEMP/failed"
          fi

      - name: Screenshots
        run: |
          # docs/screenshots/make.sh must still get through every screen. The
          # committed pictures are the ones this job makes (whiptail and tmux
          # draw slightly differently elsewhere), so a difference here means the
          # UI changed: take the "screenshots" artifact of this run and commit it.
          if bash docs/screenshots/make.sh; then
            if ! git diff --quiet -- docs/screenshots; then
              echo "note: these screenshots differ from the committed ones - commit the 'screenshots' artifact of this run if the change is intended:"
              git diff --name-only -- docs/screenshots | sed 's/^/  /'
            fi
          else
            touch "$RUNNER_TEMP/failed"
          fi

      # Go toolchain, downloaded libraries and build cache, kept between runs:
      # downloaded again only when the Go version (.forgejo/go-setup.sh) or
      # go.sum changes. New branches start from main's (go-cache.yml).
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gms-go
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('.forgejo/go-setup.sh') }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ hashFiles('.forgejo/go-setup.sh') }}-

      - name: Go toolchain
        run: bash .forgejo/go-setup.sh

      - name: Go version
        env:
          # A Go module proxy (e.g. a local caching registry) can be set as the
          # repository variable GOPROXY (Settings > Actions > Variables), so its
          # address isn't in this public file. Unset = Go's default.
          GOPROXY: ${{ vars.GOPROXY }}
        run: |
          # The Go rewrite (docs/DESIGN-GO.md): formatting, vet, tests (with a
          # real SSH/SFTP server inside the tests), and a build for every
          # platform it's released for.
          export GOTOOLCHAIN=local CGO_ENABLED=0
          go version
          ok=1 t=$SECONDS
          took() { echo "($1: $((SECONDS - t))s)"; t=$SECONDS; }
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; ok=0; fi
          go vet ./... || ok=0
          took "format + vet"
          go test -count=1 ./... || ok=0
          took "tests"
          go build -trimpath -o /dev/null ./cmd/game-mod-sync || { echo "build failed: linux/amd64"; ok=0; }
          took "build"
          # The other platforms are type-checked (including their own files,
          # e.g. the Windows SSH agent), not linked: that's the slow part. The
          # release builds all of them for real.
          for p in windows/amd64 windows/arm64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go vet ./... || { echo "doesn't compile for $p"; ok=0; }
          done
          took "other platforms"
          [ "$ok" = 1 ] || touch "$RUNNER_TEMP/failed"

      - name: Screenshots artifact
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: docs/screenshots/*.svg

      - name: Result
        run: if [ -e "$RUNNER_TEMP/failed" ]; then echo "failed - see the steps above"; exit 1; fi
